<style>
:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --ink:#18231F; --muted:#6B7570;
  --line:#E6E1D6; --accent:#0E4D42; --accent-soft:#E3EEEA; --gold:#B08D57;
  --gold-soft:#F4ECDD; --warn:#A6542B; --shadow:0 1px 2px rgba(20,30,25,.05),0 6px 20px rgba(20,30,25,.06);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101614; --surface:#18201D; --ink:#ECEFEC; --muted:#9AA5A0;
    --line:#26302C; --accent:#5FB8A4; --accent-soft:#1D2E29; --gold:#D2B07A;
    --gold-soft:#2A251C; --warn:#E39470; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-size:16px;line-height:1.6;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* الرأس */
header.wrap{padding-top:28px;padding-bottom:8px}
.logos{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logos img{height:88px;width:auto;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.08))}
.logos .mid{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
h1{font-size:22px;font-weight:700;margin:22px 0 6px;line-height:1.55;text-align:center}
.intro{color:var(--muted);margin:0 auto;max-width:440px;font-size:15px;text-align:center}

/* بطاقة البيانات */
.info{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.info-grid{display:grid;grid-template-columns:1fr 1.75fr .85fr 1fr}
.cell{padding:12px 8px;text-align:center;border-inline-start:1px solid var(--line)}
.cell:first-child{border-inline-start:0}
.cell small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.cell b{display:block;font-size:15px;white-space:nowrap;font-weight:600;min-height:24px;margin-top:2px}
.cell b.blank{border-bottom:1.5px dashed var(--line);width:44px;margin:4px auto 0;min-height:20px}
.guest{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--gold-soft)}
.guest small{font-size:13px;color:var(--gold);font-weight:600}
.guest b{font-weight:600}
@media (max-width:380px){
  .info-grid{grid-template-columns:1fr 1fr}
  .cell:nth-child(3){border-inline-start:0}
  .cell:nth-child(n+3){border-top:1px solid var(--line)}
}

/* الشريط الثابت */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 0 12px;margin-top:14px;border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--line)}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:baseline;gap:6px}
.stat strong{font-size:20px;font-weight:700;color:var(--accent)}
.stat span{font-size:13px;color:var(--muted)}
.search{width:100%;font:inherit;font-size:15px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* البطاقات */
.list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;transition:border-color .25s,box-shadow .25s}
.card.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:right}
.tick{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;transition:all .2s}
.tick svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.6);transition:all .2s}
.card.on .tick{background:var(--accent);border-color:var(--accent)}
.card.on .tick svg{opacity:1;transform:none}
.name{flex:1;font-weight:600;font-size:16px;line-height:1.5}
.count{flex:none;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--bg);padding:3px 10px;border-radius:99px;transition:all .2s;white-space:nowrap}
.card.on .count{color:var(--accent);background:var(--accent-soft)}
.card.on.empty .count{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}

.events{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.card.on .events{grid-template-rows:1fr}
.events>div{overflow:hidden}
.panel{margin:0 16px;padding:14px 0 16px;border-top:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:99px;border:1.5px solid var(--line);
  font-size:14.5px;font-weight:500;background:var(--surface);transition:all .18s;min-height:42px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .18s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-pressed="true"]::before{background:#fff}
.chip.all{border-style:dashed;color:var(--gold);border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.chip.all::before{display:none}
.chip:active{transform:scale(.96)}

/* الملاحظات */
.notes{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.notes label{font-weight:600;display:block;margin-bottom:8px}
.notes textarea{width:100%;min-height:96px;resize:vertical;font:inherit;font-size:15px;padding:12px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.notes textarea:focus{border-color:var(--accent)}
.reset.armed{color:var(--warn);font-weight:600}
.reset{display:block;margin:22px auto 0;font-size:13.5px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;padding:8px}

/* شريط الإجراءات السفلي */
.actions{position:fixed;inset-inline:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.actions .wrap{display:flex;gap:10px;padding:0}
.send{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:#fff;
  font-weight:600;font-size:17px;border-radius:16px;min-height:56px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s}
.send:active{transform:scale(.98)}
.send svg{width:22px;height:22px}
.icon-btn{flex:none;width:56px;min-height:56px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8}

/* النافذة */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(10,15,13,.45)}
.modal.open{display:flex;animation:fade .2s}
.sheet{width:100%;max-width:640px;max-height:86vh;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet h2{margin:0 0 4px;font-size:19px}
.sheet p.sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.warnbox{background:color-mix(in srgb,var(--warn) 10%,transparent);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:none}
.sheet pre{flex:1;overflow:auto;margin:0;white-space:pre-wrap;font:inherit;font-size:14.5px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.75}
.sheet .row{display:flex;gap:10px;margin-top:14px}
.sheet .row button{flex:1;min-height:50px;border-radius:14px;font-weight:600}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:var(--bg);border:1px solid var(--line)!important}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:50;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* بوابة الدخول */
body.locked > :not(.gate):not(script){display:none!important}
body.locked{padding-bottom:0}
.gate{display:none;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px 16px}
body.locked .gate{display:flex}
.gate-box{width:100%;max-width:380px;text-align:center}
.gate .logos img{height:72px}
.gate h2{font-size:18px;font-weight:700;margin:22px 0 4px;line-height:1.6}
.gate p{color:var(--muted);font-size:14.5px;margin:0 0 20px}
.pw{position:relative}
.pw input{width:100%;font:inherit;font-size:17px;padding:14px 16px;padding-inline-start:52px;border-radius:16px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);outline:none;text-align:center;letter-spacing:1px;direction:ltr;transition:border-color .2s,box-shadow .2s}
.pw input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pw .eye{position:absolute;top:50%;transform:translateY(-50%);right:6px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.pw .eye svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8}
.gate .go{width:100%;margin-top:12px;min-height:54px;border-radius:16px;background:var(--accent);color:#fff;font-weight:600;font-size:17px}
.gate .err{color:var(--warn);font-size:14px;min-height:22px;margin-top:10px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>
</head>

    <div class="logos">

      <img class="glogo" alt="">

      <input id="pw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="كلمة المرور">

    </div>

</div>

  </div>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>

  <section class="info">
    <div class="info-grid" id="infoGrid"></div>
    <div class="guest"><small>الضيوف</small><b id="guest"></b></div>
  </section>
</header>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="stats">
      <div class="stat"><strong id="sPeople">٠</strong><span id="sPeopleLbl">مدعو</span></div>
      <div class="stat"><strong id="sEvents">٠</strong><span>اختيار فعالية</span></div>
    </div>
    <input class="search" id="search" type="search" placeholder="ابحث في القائمة…" autocomplete="off">
  </div>
</div>

<main class="wrap">
  <div class="list" id="list"></div>
  <p class="empty-msg" id="emptyMsg">لا نتائج مطابقة</p>

  <section class="notes">
    <label for="notes">ملاحظات سعادة القائد</label>
    <textarea id="notes" placeholder="أي توجيه عام خارج القائمة…"></textarea>
  </section>

  <button class="reset" id="resetBtn" type="button">مسح جميع الاختيارات</button>
</main>

<div class="actions">
  <div class="wrap">
    <button class="icon-btn" id="previewBtn" type="button" aria-label="معاينة">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="send" id="sendBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      إرسال التوجيهات
    </button>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <h2 id="mTitle">معاينة الرسالة</h2>
    <p class="sub">هذا ما سيصل بالضبط.</p>
    <div class="warnbox" id="warnbox"></div>
    <pre id="previewText"></pre>
    <div class="row">
      <button class="btn-ghost" id="copyBtn" type="button">نسخ</button>
      <button class="btn-primary" id="sendFromModal" type="button">إرسال</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const EV = CONFIG.events;
  const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
  let state = { sel:{}, notes:"" };

  /* الحفظ */
  function load(){
    try{ const s = JSON.parse(localStorage.getItem(CONFIG.storageKey) || "null");
      if(s && typeof s === "object"){ state.sel = s.sel || {}; state.notes = s.notes || ""; } }catch(e){}
  }
  function save(){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); }catch(e){} }

  /* البناء */
  const tickSvg = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function render(){
    $("title").textContent = CONFIG.title;
    $("intro").textContent = CONFIG.intro;
    document.title = "توجيهات سعادة القائد";
    $("infoGrid").innerHTML = CONFIG.info.map(f =>
      '<div class="cell"><small>' + esc(f.label) + '</small><b' + (f.value ? '>' + esc(f.value) : ' class="blank">') + '</b></div>').join("");
    $("guest").textContent = CONFIG.guest;

    $("list").innerHTML = CONFIG.invitees.map(name => {
      const chips = EV.map((ev, j) =>
        '<button type="button" class="chip" data-ev="' + j + '" aria-pressed="false">' + esc(ev) + '</button>').join("") +
        '<button type="button" class="chip all" data-all="1">الكل</button>';
      return '<article class="card" data-name="' + esc(name) + '">' +
        '<button type="button" class="head" aria-expanded="false">' +
        '<span class="tick">' + tickSvg + '</span>' +
        '<span class="name">' + esc(name) + '</span><span class="count"></span></button>' +
        '<div class="events"><div><div class="panel"><div class="chips">' + chips + '</div></div></div></div></article>';
    }).join("");
    $("notes").value = state.notes;
    refresh();
  }

  function refresh(){
    let people = 0, picks = 0;
    document.querySelectorAll(".card").forEach(card => {
      const name = card.dataset.name, sel = state.sel[name];
      const on = Array.isArray(sel);
      card.classList.toggle("on", on);
      card.classList.toggle("empty", on && sel.length === 0);
      const head = card.querySelector(".head");
      if(head) head.setAttribute("aria-expanded", on ? "true" : "false");
      card.querySelectorAll(".chip[data-ev]").forEach(ch =>
        ch.setAttribute("aria-pressed", on && sel.includes(+ch.dataset.ev) ? "true" : "false"));
      const allBtn = card.querySelector(".chip.all");
      if(allBtn) allBtn.textContent = on && sel.length === EV.length ? "إلغاء الكل" : "الكل";
      const c = card.querySelector(".count");
      if(c) c.textContent = !on ? "غير مدعو" : sel.length === 0 ? "اختر فعالية" :
        sel.length === EV.length ? "كل الفعاليات" : ar(sel.length) + " من " + ar(EV.length);
      if(on){ people++; picks += sel.length; }
    });
    $("sPeople").textContent = ar(people);
    $("sPeopleLbl").textContent = "مدعو من " + ar(CONFIG.invitees.length);
    $("sEvents").textContent = ar(picks);
  }

  /* التفاعل — مستمع واحد مقيَّد بالقائمة */
  $("list").addEventListener("click", e => {
    const card = e.target.closest(".card"); if(!card) return;
    const name = card.dataset.name;
    if(e.target.closest(".head")){
      if(Array.isArray(state.sel[name])) delete state.sel[name]; else state.sel[name] = [];
    } else {
      const chip = e.target.closest(".chip"); if(!chip) return;
      const sel = state.sel[name]; if(!Array.isArray(sel)) return;
      if(chip.dataset.all){
        state.sel[name] = sel.length === EV.length ? [] : EV.map((_, j) => j);
      } else {
        const j = +chip.dataset.ev, k = sel.indexOf(j);
        if(k > -1) sel.splice(k, 1); else { sel.push(j); sel.sort((a,b)=>a-b); }
      }
    }
    save(); refresh();
  });

  $("notes").addEventListener("input", e => { state.notes = e.target.value; save(); });

  $("search").addEventListener("input", e => {
    const q = e.target.value.trim(); let shown = 0;
    document.querySelectorAll(".card").forEach(card => {
      const hit = !q || card.dataset.name.includes(q);
      card.style.display = hit ? "" : "none"; if(hit) shown++;
    });
    $("emptyMsg").style.display = shown ? "none" : "block";
  });

  let armed = false, armT;
  $("resetBtn").addEventListener("click", () => {
    const btn = $("resetBtn");
    if(!armed){
      armed = true; btn.classList.add("armed"); btn.textContent = "اضغط مرة أخرى لتأكيد المسح";
      clearTimeout(armT); armT = setTimeout(disarm, 4000); return;
    }
    disarm();
    state = { sel:{}, notes:"" }; save(); render();
    $("search").value = ""; $("emptyMsg").style.display = "none";
    toast("تم مسح جميع الاختيارات");
  });
  function disarm(){ armed = false; clearTimeout(armT); const b = $("resetBtn"); b.classList.remove("armed"); b.textContent = "مسح جميع الاختيارات"; }

  window.addEventListener("scroll", () => $("bar").classList.toggle("scrolled", window.scrollY > 300), {passive:true});

  /* الرسالة */
  function chosen(){ return CONFIG.invitees.filter(n => Array.isArray(state.sel[n])); }

  function buildMessage(){
    const list = chosen(), L = [];
    L.push("📋 " + CONFIG.title);
    CONFIG.info.forEach(f => L.push(f.label + ": " + (f.value || "—")));
    L.push("الضيوف: " + CONFIG.guest);
    L.push("");
    L.push("عدد المدعوين: " + ar(list.length) + " من " + ar(CONFIG.invitees.length));
    L.push("");
    if(!list.length) L.push("لم يُحدَّد أي مدعو.");
    list.forEach(n => {
      const s = state.sel[n];
      L.push("• " + n);
      L.push("   ← " + (s.length === 0 ? "لم تُحدَّد فعالية" : s.length === EV.length ? "جميع الفعاليات" : s.map(j => EV[j]).join("، ")));
    });
    if(list.length){
      L.push(""); L.push("━━ حسب الفعالية ━━");
      EV.forEach((ev, j) => {
        const who = list.filter(n => state.sel[n].includes(j));
        L.push(""); L.push("▪︎ " + ev + " (" + ar(who.length) + ")");
        L.push(who.length ? who.map(w => "   - " + w).join("\n") : "   - لا أحد");
      });
    }
    const notes = state.notes.trim();
    if(notes){ L.push(""); L.push("━━ ملاحظات سعادة القائد ━━"); L.push(notes); }
    return L.join("\n");
  }

  function warnings(){
    const w = [], list = chosen();
    if(!list.length) w.push("لم يُحدَّد أي مدعو بعد.");
    const noEv = list.filter(n => state.sel[n].length === 0);
    if(noEv.length) w.push("بلا فعالية محددة: " + noEv.join("، "));
    return w;
  }

  /* النسخ والإرسال */
  async function copy(text){
    try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
    try{
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly","");
      ta.style.cssText = "position:fixed;top:0;opacity:0"; document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
    }catch(e){ return false; }
  }

  async function send(){
    const text = buildMessage();
    if(navigator.share){
      try{ await navigator.share({ text }); closeModal(); return; }
      catch(e){ if(e && e.name === "AbortError") return; }
    }
    const ok = await copy(text);
    closeModal();
    toast(ok ? "نُسخت الرسالة — الصقها في محادثة سيقنل" : "افتح المعاينة وانسخ النص يدويًا");
    if(ok && CONFIG.signalNumber)
      setTimeout(() => { location.href = "https://signal.me/#p/" + CONFIG.signalNumber.replace(/\s/g,""); }, 1200);
  }

  function openModal(){
    $("previewText").textContent = buildMessage();
    const w = warnings(), box = $("warnbox");
    box.innerHTML = w.map(esc).join("<br>"); box.style.display = w.length ? "block" : "none";
    $("modal").classList.add("open");
  }
  function closeModal(){ $("modal").classList.remove("open"); }

  $("previewBtn").addEventListener("click", openModal);
  $("sendBtn").addEventListener("click", () => { warnings().length ? openModal() : send(); });
  $("sendFromModal").addEventListener("click", send);
  $("copyBtn").addEventListener("click", async () => toast(await copy(buildMessage()) ? "تم النسخ" : "تعذّر النسخ، حدّد النص يدويًا"));
  $("modal").addEventListener("click", e => { if(e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

  let tt;
  function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2600); }


  /* بوابة الدخول */
  const hl = document.querySelectorAll("header .logos img"), gl = document.querySelectorAll(".glogo");
  gl.forEach((im, k) => { if(hl[k]) im.src = hl[k].src; });
  const UNLOCK_KEY = CONFIG.storageKey + ":ok";
  async function sha256(s){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }
  function unlock(){ document.body.classList.remove("locked"); window.scrollTo(0,0); }
  try{ if(localStorage.getItem(UNLOCK_KEY) === CONFIG.passHash) unlock(); }catch(e){}
  $("eye").addEventListener("click", () => { const i = $("pw"); i.type = i.type === "password" ? "text" : "password"; i.focus(); });
  $("gateForm").addEventListener("submit", async e => {
    e.preventDefault();
    const v = $("pw").value;
    if(!v){ $("err").textContent = "أدخل كلمة المرور"; return; }
    if(!(window.crypto && crypto.subtle)){ $("err").textContent = "افتح الصفحة من رابطها المباشر"; return; }
    if(await sha256(v) === CONFIG.passHash){
      try{ localStorage.setItem(UNLOCK_KEY, CONFIG.passHash); }catch(e){}
      $("err").textContent = ""; unlock();
    } else {
      $("err").textContent = "كلمة المرور غير صحيحة";
      const w = $("pwWrap"); w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake");
      $("pw").select();
    }
  });

  load(); render();
})();
</script>
</body>
</html>
